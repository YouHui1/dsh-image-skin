name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pin to the version that produced pnpm-lock.yaml; pnpm 11.21 needs
          # Node >= 22.13 (it uses the node:sqlite builtin).
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm-workspace.yaml allowlists esbuild's postinstall, so the platform
      # binary is wired up correctly on this runner.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke
